<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* GenZ Capital — "comment SEND" CTA end-card.
       * Self-contained: does NOT use ../styles.css (that sheet is tuned for
       * the 5-beat reel body). 1080x1920, pure black, 5 seconds.
       * Mimics an Instagram DM thread: the viewer sees exactly what they
       * get for commenting "Send".
       */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { width: 1080px; height: 1920px; background: #000; }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: #000;
        overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .stage { position: absolute; inset: 0; }

      /* ---------- headline ---------- */
      .head {
        position: absolute;
        top: 210px; left: 0; width: 1080px;
        text-align: center;
      }
      .head-top {
        font-size: 44px; font-weight: 600; letter-spacing: 0.14em;
        color: #8c929a; text-transform: uppercase;
      }
      .head-big {
        margin-top: 26px;
        font-family: 'Anton', sans-serif;
        font-size: 118px; line-height: 1; letter-spacing: 0.01em;
        color: #fff; text-transform: uppercase;
      }
      .neon { color: #39ff14; }

      /* ---------- chat mock ---------- */
      .chat {
        position: absolute;
        left: 70px; top: 600px;
        width: 940px; height: 1010px;
        background: #0d0f12;
        border: 2px solid #23272e;
        border-radius: 52px;
        overflow: hidden;
      }

      .chat-head {
        position: relative;
        height: 150px;
        border-bottom: 2px solid #1c2026;
        display: flex; align-items: center;
        padding: 0 40px;
      }
      .back {
        width: 26px; height: 26px;
        border-left: 5px solid #e7e9ea;
        border-bottom: 5px solid #e7e9ea;
        transform: rotate(45deg);
        margin-right: 30px;
      }
      .avatar {
        width: 84px; height: 84px; border-radius: 50%;
        background: #39ff14;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Anton', sans-serif;
        font-size: 38px; color: #000; letter-spacing: 0.02em;
      }
      .who { margin-left: 26px; }
      .who-name {
        font-size: 38px; font-weight: 700; color: #fff;
        display: flex; align-items: center; gap: 12px;
      }
      .tick {
        width: 30px; height: 30px; border-radius: 50%;
        background: #39ff14; color: #000;
        font-size: 20px; font-weight: 800;
        display: flex; align-items: center; justify-content: center;
      }
      .who-sub { font-size: 27px; color: #6b7280; margin-top: 6px; }

      /* ---------- thread ---------- */
      .thread {
        position: relative;
        height: 700px;
        padding: 40px;
      }

      /* Chronological order, top to bottom: your "Send" first, their reply
       * underneath. The two slots must never overlap — the reply card is
       * tall, so it gets everything below y=180. */
      .bubble-sent {
        position: absolute;
        right: 40px; top: 40px;
        background: #39ff14; color: #000;
        font-size: 42px; font-weight: 600;
        padding: 26px 46px;
        border-radius: 40px 40px 12px 40px;
        opacity: 0;
      }

      .bubble-in {
        position: absolute;
        left: 40px; top: 180px;
        background: #22262c;
        border-radius: 40px 40px 40px 12px;
        opacity: 0;
      }

      .dots { padding: 34px 44px; display: flex; gap: 20px; }
      .dot {
        width: 20px; height: 20px; border-radius: 50%;
        background: #7b828c;
      }

      .reply { width: 680px; padding: 30px; }
      .reply-txt {
        font-size: 38px; color: #e7e9ea; font-weight: 500;
        margin-bottom: 24px;
      }
      .card {
        background: #14171b; border-radius: 26px; overflow: hidden;
      }
      .thumb {
        position: relative;
        height: 210px;
        background: linear-gradient(135deg, #1d2127 0%, #0c0e11 100%);
        display: flex; align-items: center; justify-content: center;
      }
      .play {
        width: 132px; height: 92px; border-radius: 26px;
        background: #ff0000;
        display: flex; align-items: center; justify-content: center;
      }
      .play::after {
        content: '';
        border-left: 34px solid #fff;
        border-top: 21px solid transparent;
        border-bottom: 21px solid transparent;
        margin-left: 8px;
      }
      .card-meta { padding: 24px 28px; }
      .card-link {
        font-size: 30px; color: #39ff14; font-weight: 600;
      }
      .card-host { font-size: 25px; color: #6b7280; margin-top: 8px; }

      /* ---------- input bar ---------- */
      .bar {
        position: absolute;
        left: 40px; right: 40px; bottom: 36px;
        height: 118px;
        background: #1b1f25;
        border-radius: 59px;
        display: flex; align-items: center;
        padding: 0 22px 0 46px;
      }
      .bar-text {
        position: relative;
        flex: 1;
        font-size: 42px; color: #fff; font-weight: 500;
        display: flex; align-items: center;
      }
      /* Absolute so it occupies no flow width — otherwise the faded-out
       * placeholder keeps pushing the typed word toward the middle. */
      .placeholder {
        position: absolute; left: 0; top: 50%;
        transform: translateY(-50%);
        color: #5b626b;
      }
      .typed { white-space: pre; }
      .typed span { opacity: 0; }
      .caret {
        display: inline-block;
        width: 4px; height: 46px;
        background: #39ff14;
        margin-left: 4px;
      }
      .send {
        position: relative;
        width: 84px; height: 84px; border-radius: 50%;
        background: #39ff14;
        display: flex; align-items: center; justify-content: center;
      }
      .send::after {
        content: '';
        border-left: 34px solid #000;
        border-top: 20px solid transparent;
        border-bottom: 20px solid transparent;
        margin-left: 10px;
      }
      .ripple {
        position: absolute;
        left: 50%; top: 50%;
        width: 84px; height: 84px; margin: -42px 0 0 -42px;
        border-radius: 50%;
        border: 5px solid #39ff14;
        opacity: 0;
      }

      /* ---------- footer ---------- */
      .foot {
        position: absolute;
        left: 0; bottom: 190px; width: 1080px;
        text-align: center;
        font-size: 34px; font-weight: 600; letter-spacing: 0.18em;
        color: #6b7280; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="cta-send"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div id="cta-stage" class="stage clip" data-start="0" data-duration="5" data-track-index="0">
        <!-- the ask, in words -->
        <div class="head">
          <div class="head-top" id="h1">Want the full video?</div>
          <div class="head-big" id="h2">
            COMMENT <span class="neon" id="h2b">"SEND"</span>
          </div>
        </div>

        <!-- the ask, demonstrated -->
        <div class="chat" id="chat">
          <div class="chat-head">
            <div class="back"></div>
            <div class="avatar">GZ</div>
            <div class="who">
              <div class="who-name">genzcapital <span class="tick">&check;</span></div>
              <div class="who-sub">Active now</div>
            </div>
          </div>

          <div class="thread">
            <!-- typing indicator (they're replying) -->
            <div class="bubble-in" id="dots">
              <div class="dots">
                <div class="dot" id="d1"></div>
                <div class="dot" id="d2"></div>
                <div class="dot" id="d3"></div>
              </div>
            </div>

            <!-- the payoff: the link lands in your DMs -->
            <div class="bubble-in" id="reply">
              <div class="reply">
                <div class="reply-txt">Here's the full video</div>
                <div class="card">
                  <div class="thumb"><div class="play"></div></div>
                  <div class="card-meta">
                    <div class="card-link">GenZ Capital — full breakdown</div>
                    <div class="card-host">youtube.com/@genzcapital</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- the word you type -->
            <div class="bubble-sent" id="sent">Send</div>
          </div>

          <div class="bar">
            <div class="bar-text">
              <span class="placeholder" id="ph">Message...</span
              ><span class="typed" id="typed"
                ><span>S</span><span>e</span><span>n</span><span>d</span></span
              ><span class="caret" id="caret"></span>
            </div>
            <div class="send" id="send">
              <div class="ripple" id="ripple"></div>
            </div>
          </div>
        </div>

        <div class="foot" id="foot">Sent straight to your DMs</div>
      </div>
    </div>

    <script>
      /* Deterministic only — no Date.now(), no Math.random(), no fetch.
       * Every motion is a GSAP tween on the registered paused timeline, so
       * HyperFrames can seek to any frame and get the same pixels. (CSS
       * @keyframes would run on wall-clock and tear during frame capture.)
       *
       * Beat map (5.0s):
       *   0.00  chat panel + headline in
       *   0.55  type S-e-n-d, caret blinking
       *   1.55  tap send: ripple + button pulse
       *   1.75  "Send" bubble springs up into the thread
       *   2.15  typing dots bounce
       *   2.85  dots out, reply + YouTube card slide in
       *   3.60  neon pulse on the link, hold to 5.00
       */
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* --- entrance --- */
      tl.fromTo('#chat',
        { opacity: 0, scale: 0.94, y: 40 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0);
      tl.fromTo('#h1',
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.40, ease: 'power2.out' }, 0.05);
      tl.fromTo('#h2',
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2.2)' }, 0.15);
      tl.fromTo('#foot',
        { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.35);

      /* --- caret blink (stops once sent) --- */
      tl.to('#caret', { opacity: 0, duration: 0.25, ease: 'steps(1)',
        yoyo: true, repeat: 5 }, 0.45);

      /* --- type "Send", one letter at a time --- */
      var letters = ['#typed span:nth-child(1)', '#typed span:nth-child(2)',
                     '#typed span:nth-child(3)', '#typed span:nth-child(4)'];
      tl.to('#ph', { opacity: 0, duration: 0.01 }, 0.55);
      letters.forEach(function (sel, i) {
        tl.to(sel, { opacity: 1, duration: 0.01 }, 0.55 + i * 0.22);
      });

      /* --- tap the send button --- */
      // press-in then spring-back; overwrite:'auto' so the two scale tweens
      // on #send never fight at the hand-off frame.
      tl.to('#send', { scale: 0.88, duration: 0.10, ease: 'power2.in',
        overwrite: 'auto' }, 1.55);
      tl.to('#send', { scale: 1.0, duration: 0.28, ease: 'back.out(3)',
        overwrite: 'auto' }, 1.66);
      tl.fromTo('#ripple',
        { opacity: 0.9, scale: 1 },
        { opacity: 0, scale: 2.4, duration: 0.55, ease: 'power2.out' }, 1.55);

      /* --- input clears, the word flies up into the thread --- */
      tl.to(['#typed', '#caret'], { opacity: 0, duration: 0.12 }, 1.70);
      tl.to('#ph', { opacity: 1, duration: 0.20 }, 1.95);
      // travels up from the input bar into its slot at the top of the thread
      tl.fromTo('#sent',
        { opacity: 0, y: 560, scale: 0.85 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'back.out(1.6)' },
        1.75);

      /* --- they're typing --- */
      tl.fromTo('#dots',
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, 2.15);
      [['#d1', 0], ['#d2', 0.12], ['#d3', 0.24]].forEach(function (d) {
        tl.to(d[0], { y: -16, duration: 0.22, ease: 'sine.inOut',
          yoyo: true, repeat: 3 }, 2.30 + d[1]);
      });
      tl.to('#dots', { opacity: 0, scale: 0.85, duration: 0.20 }, 2.85);

      /* --- payoff: the link arrives --- */
      tl.fromTo('#reply',
        { opacity: 0, y: 90, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'back.out(1.6)' },
        2.95);

      /* --- hold with a neon pulse so the eye lands on the link --- */
      tl.to('#h2b', {
        textShadow: '0 0 90px rgba(57,255,20,1), 0 0 180px rgba(57,255,20,0.7)',
        scale: 1.04, duration: 0.40, ease: 'sine.inOut', yoyo: true, repeat: 3
      }, 3.60);

      window.__timelines['cta-send'] = tl;
    </script>
  </body>
</html>
