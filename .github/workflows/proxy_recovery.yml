name: Rebuild Parked Reels

# Sweeper for reels that got parked at Status="Proxy Empty - Retry" instead of
# having their topic burned as "Skipped - No Video" (see tweet_card_reel.py).
# Parking happens when a download path is temporarily unusable — originally
# only "the DataImpulse residential proxy ran out of traffic".
#
# Two modes, decided by publisher/proxy_recovery.py at runtime:
#   * PROXY_URL set (cloud runner)  -> probe the proxy first; still dead means
#     exit quietly and leave the rows parked for the next sweep.
#   * PROXY_URL unset (this runner) -> downloads go out over the home IP, so
#     there is nothing to wait for and parked rows rebuild immediately.
#
# Runs on the SAME self-hosted PC runner as build_tweet_card_reel.yml, because
# the renders happen inline here (repository_dispatch is not an option: the
# default GITHUB_TOKEN cannot trigger other workflows) and because the home IP
# is what gets us past YouTube's datacenter bot-block. Deliberately NO
# PROXY_URL in env — see the build workflow header for the 2026-08-02 reasons.
#
# Daily rather than 6-hourly: with no proxy balance to poll, this is only a net
# for leftovers, and a self-hosted job that finds no online runner for 24h
# fails red — fewer ticks means less noise while the PC is off.

on:
  schedule:
    - cron: "20 3 * * *"   # 11:20 SGT — daytime, PC usually on
  workflow_dispatch: {}

# Never two sweeps at once (double-render risk). A queued tick that gets
# superseded is harmless — every run re-scans the sheet from scratch.
concurrency:
  group: proxy-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, windows, genz-pc]
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_REELS_NAME: Reels
      YOUTUBE_COOKIES_FILE: youtube_cookies.txt
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No actions/setup-python here — it hangs on a self-hosted Windows runner
      # trying to provision a tool-cache Python. The PC's own Python is used.
      - name: Verify build tools + put winget ffmpeg on PATH
        run: |
          python --version
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            $ff = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'Gyan\.FFmpeg' } | Select-Object -First 1
            if ($ff) {
              $bin = Split-Path $ff.FullName
              Add-Content -Path $env:GITHUB_PATH -Value $bin
              Write-Host "Added winget ffmpeg to PATH: $bin"
            } else {
              Write-Host "::warning::winget ffmpeg not found; the code's resolver will still locate it via its known install path."
            }
          } else {
            Write-Host "ffmpeg already on PATH: $((Get-Command ffmpeg).Source)"
          }
          foreach ($tool in 'deno','node') {
            $c = Get-Command $tool -ErrorAction SilentlyContinue
            if ($c) { Write-Host "OK  $tool -> $($c.Source)" } else { Write-Host "::warning::$tool not on PATH (yt-dlp can still run; JS solver may degrade)" }
          }

      - name: Install Python dependencies (persistent venv)
        # Same venv the build workflow uses — outside the repo so checkout-clean
        # keeps it, and already warm from previous reel builds.
        id: venv
        run: |
          $venv = "C:\actions-runner\genz-venv"
          if (-not (Test-Path "$venv\Scripts\python.exe")) {
            Write-Host "Creating venv at $venv ..."
            python -m venv $venv
          }
          $py = "$venv\Scripts\python.exe"
          & $py -m pip install --upgrade pip
          & $py -m pip install -r requirements.txt
          & $py -m pip install yt-dlp
          "python=$py" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using venv python: $py"

      - name: Write .env
        # OVERWRITE, not append: the self-hosted runner reuses its working
        # directory and .env is gitignored, so stale keys would otherwise pile
        # up. Note PROXY_URL is intentionally absent (direct-download mode).
        run: |
          $lines = @(
            "GOOGLE_SHEET_ID=$env:GOOGLE_SHEET_ID"
            "GOOGLE_SHEET_REELS_NAME=$env:GOOGLE_SHEET_REELS_NAME"
            "YOUTUBE_API_KEY=$env:YOUTUBE_API_KEY"
          )
          Set-Content -Path .env -Value $lines -Encoding utf8

      - name: Write Google service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          [System.IO.File]::WriteAllText("$PWD/google_service_account.json", $env:GOOGLE_SERVICE_ACCOUNT_JSON)

      - name: Write Drive OAuth token
        env:
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:GOOGLE_DRIVE_TOKEN_JSON)) {
            [System.IO.File]::WriteAllText("$PWD/google_drive_token.json", $env:GOOGLE_DRIVE_TOKEN_JSON)
          }

      - name: Write YouTube cookies (OPTIONAL — cookieless is the default)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YOUTUBE_COOKIES)) {
            Write-Host "::notice::No YOUTUBE_COOKIES secret — using cookieless clients from the home IP (the normal, reliable path)."
          } else {
            $env:YOUTUBE_COOKIES | Out-File -FilePath youtube_cookies.txt -Encoding ascii
          }

      - name: Rebuild parked reels
        env:
          PY: ${{ steps.venv.outputs.python }}
        run: |
          New-Item -ItemType Directory -Force -Path logs, renders | Out-Null
          $ErrorActionPreference = 'Continue'
          & $env:PY publisher/proxy_recovery.py 2>&1 | Tee-Object -FilePath "logs/proxy_recovery.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::proxy_recovery.py exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-recovery-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
