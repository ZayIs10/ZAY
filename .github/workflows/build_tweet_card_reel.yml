name: Build Tweet-Card Reel

# Fired by Workflow B (n8n) after it has written Media Video URL +
# Media Image URL to a Reels-tab row that the user flipped to
# Status="Ready to Run".
#
# n8n call shape:
#   POST https://api.github.com/repos/<owner>/<repo>/dispatches
#   {
#     "event_type": "build-tweet-card-reel",
#     "client_payload": { "topic": "Exact Topic string" }
#   }
#
# Also runnable manually from the GitHub Actions UI (specify topic or row_index).
#
# ===========================================================================
# WHERE THIS RENDERS IS DECIDED AT RUNTIME (rebuilt 2026-08-02)
# ===========================================================================
# YouTube permanently bot-blocks datacenter IPs (GitHub Actions) with "Sign in
# to confirm you're not a bot" — no login fixes it, it is the IP. So a cloud
# build can only download through a RESIDENTIAL proxy, and a proxy needs a live
# paid balance. Historically we flipped this file by hand between two modes and
# each flip was a fresh outage: leave PROXY_URL set with an empty balance and
# every download 407s; forget to remove it and the same thing happens on the PC.
#
# Now there are three jobs and the flip is automatic:
#
#   probe  — ubuntu-latest, ~20s. Tests whether PROXY_URL can actually pass
#            traffic right now. Outputs cloud=true|false.
#   cloud  — ubuntu-latest, runs only when the probe says the proxy is ALIVE.
#            The user's PC can be off. Downloads route through the proxy.
#   pc     — [self-hosted, windows, genz-pc] (the user's PC, "marc-pc"), runs
#            when the proxy is dead/unset, OR as a fallback if the cloud job
#            failed. Uses the home IP, which YouTube trusts, and costs nothing.
#            If the PC is off the job QUEUES and runs when it comes online.
#
# Net effect: buying proxy traffic switches reels to the cloud with no code
# change, and the traffic running out silently falls back to the PC instead of
# parking rows. Never add a workflow-level `concurrency:` block here — GitHub
# cancels queued runs and topics get silently dropped.
#
# PROXY provider notes (see memory reel_render_cloud_only):
#   - The pipeline downloads only the used section of each clip (~3 MB/reel),
#     so it consumes ~0.3 GB/month at one reel/day.
#   - At that volume the ONLY metric that matters is whether traffic EXPIRES.
#     Thordata (current secret) expires ~30 days after purchase, so the balance
#     must be renewed to keep the cloud path alive — when it lapses this
#     workflow just uses the PC again rather than failing.
#   - DEBUGGING A DEAD PROXY: probe over plain http://, never https://.
#     Providers return their real error as a response body over HTTP
#     ("Your proxy package has expired..."); over HTTPS the identical request
#     dies at the TLS handshake with no message (curl exit 35, http_code 000).
#
# Tools on the PC are pre-installed (Python 3.13, ffmpeg via winget, Deno,
# yt-dlp, node) — the pc job VERIFIES them rather than installing them.

on:
  repository_dispatch:
    types: [build-tweet-card-reel]
  workflow_dispatch:
    inputs:
      topic:
        description: "Exact Topic string to render (preferred; robust to row reordering)"
        required: false
        type: string
      row_index:
        description: "1-indexed Reels-tab row to render (fallback if topic is blank)"
        required: false
        type: string

jobs:
  # ==========================================================================
  # 1. PROBE — can the residential proxy pass traffic right now?
  # ==========================================================================
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cloud: ${{ steps.check.outputs.cloud }}
    steps:
      - name: Probe the residential proxy
        id: check
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          cloud=false
          reason=""

          if [ -z "${PROXY_URL:-}" ]; then
            reason="PROXY_URL secret is not set"
          else
            # STEP 1 — plain HTTP. Providers return their real refusal as a
            # BODY here. The same request over HTTPS dies at the TLS handshake
            # with no message at all, so http:// is the only readable probe.
            resp=$(curl -s --max-time 30 -w '\n%{http_code}' -x "$PROXY_URL" "http://ipinfo.io/json" 2>/dev/null || true)
            code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')

            if [ "$code" != "200" ]; then
              reason="plain-HTTP probe returned HTTP ${code:-none}"
            elif printf '%s' "$body" | grep -qiE 'errorMsg|expired|no service permission|exhausted|insufficient|renewal'; then
              # e.g. Thordata "Your proxy package has expired, and you currently
              # have no service permissions", DataImpulse "TRAFFIC_EXHAUSTED".
              reason="provider refused traffic: $(printf '%s' "$body" | tr -d '\n' | head -c 180)"
            else
              # STEP 2 — HTTPS must work too. yt-dlp only ever talks HTTPS to
              # YouTube, and a proxy can pass http:// while failing CONNECT+TLS.
              tls=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -x "$PROXY_URL" "https://www.google.com/generate_204" 2>/dev/null || true)
              if [ "$tls" = "204" ]; then
                cloud=true
                reason="proxy alive, exit $(printf '%s' "$body" | tr -d '\n ' | grep -oE '"ip":"[0-9.]+"' | head -1)"
              else
                reason="HTTPS through the proxy failed (http_code=${tls:-none})"
              fi
            fi
          fi

          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"
          if [ "$cloud" = "true" ]; then
            echo "::notice::Rendering in GitHub's CLOUD (your PC can stay off) — $reason"
          else
            echo "::notice::Rendering on the SELF-HOSTED PC (free, home IP) — $reason"
          fi

  # ==========================================================================
  # 2. CLOUD BUILD — proxy is alive, the user's PC is not needed.
  # ==========================================================================
  cloud:
    needs: probe
    if: needs.probe.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_REELS_NAME: Reels
      YOUTUBE_COOKIES_FILE: youtube_cookies.txt
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Residential proxy — the load-bearing secret that lets the cloud download
      # YouTube clips at all. See media_consumer._ytdlp_base_opts / _http_download.
      PROXY_URL: ${{ secrets.PROXY_URL }}
      # Instagram staging (upload + process the reel; the user taps Publish).
      # If unset the build still succeeds — it skips IG staging and the review
      # email tells the user to post from the Drive link instead.
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
      # Review-email notifier (Gmail SMTP, app password). If these secrets are
      # unset the build still succeeds — it just skips the email.
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        # setup-python is fine on Linux — the hang that bit us was Windows-only.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg + Deno
        # ffmpeg: the full apt build supports -crf (stripped builds reject it).
        # Deno: yt-dlp's JS runtime for the YouTube "n challenge" solver.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Verify tools
        run: |
          python --version
          ffmpeg -version | head -1
          deno --version | head -1 || echo "::warning::deno not found (yt-dlp JS solver may degrade)"

      - name: Write .env
        run: |
          {
            printf "GOOGLE_SHEET_ID=%s\n" "$GOOGLE_SHEET_ID"
            printf "GOOGLE_SHEET_REELS_NAME=%s\n" "$GOOGLE_SHEET_REELS_NAME"
            printf "YOUTUBE_API_KEY=%s\n" "$YOUTUBE_API_KEY"
            printf "PROXY_URL=%s\n" "$PROXY_URL"
          } > .env

      - name: Write Google service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google_service_account.json

      - name: Write Drive OAuth token
        # Pre-authorized token JSON (run publish_reel.py locally once to mint it,
        # then copy the contents of google_drive_token.json into this secret).
        env:
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
        run: |
          if [ -n "$GOOGLE_DRIVE_TOKEN_JSON" ]; then
            printf '%s' "$GOOGLE_DRIVE_TOKEN_JSON" > google_drive_token.json
          fi

      - name: Write YouTube cookies (OPTIONAL — proxy + cookieless is the default)
        # Downloads use cookieless YouTube player clients through the residential
        # proxy, so login cookies are NOT required. If the secret IS present we
        # still write it as a bonus for rare age-gated clips; empty is normal.
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "::notice::No YOUTUBE_COOKIES secret — using cookieless clients through the proxy (the normal path)."
          else
            printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
            echo "Wrote youtube_cookies.txt ($(wc -l < youtube_cookies.txt) lines) — used as a bonus backup."
          fi

      - name: Resolve target (topic preferred, row_index fallback)
        id: target
        env:
          # Topic is the robust selector: it can't drift if the sheet is
          # re-sorted between n8n firing and this build running. row_index
          # is kept only as a fallback for old callers / manual runs.
          TOPIC: ${{ github.event.client_payload.topic || github.event.inputs.topic }}
          ROW_INDEX: ${{ github.event.client_payload.row_index || github.event.inputs.row_index }}
        run: |
          if [ -n "$TOPIC" ]; then
            echo "mode=topic" >> "$GITHUB_OUTPUT"
            echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
            echo "Building reel for Topic: $TOPIC"
          elif [ -n "$ROW_INDEX" ]; then
            echo "mode=row" >> "$GITHUB_OUTPUT"
            echo "row=$ROW_INDEX" >> "$GITHUB_OUTPUT"
            echo "Building reel for Reels row $ROW_INDEX (no topic given)"
          else
            echo "::error::Neither topic nor row_index provided"
            exit 1
          fi

      - name: Build reel
        env:
          TOPIC: ${{ steps.target.outputs.topic }}
          ROW: ${{ steps.target.outputs.row }}
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          set -o pipefail
          mkdir -p logs renders
          if [ "$MODE" = "topic" ]; then
            python publisher/tweet_card_reel.py --topic "$TOPIC" 2>&1 | tee "logs/tweet_card_reel.log"
          else
            python publisher/tweet_card_reel.py --row "$ROW" 2>&1 | tee "logs/tweet_card_reel_row${ROW}.log"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweet-card-reel-logs-cloud-${{ github.run_id }}
          path: logs/
          retention-days: 7

      - name: Upload reel mp4 (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweet-card-reel-mp4-cloud-${{ github.run_id }}
          path: renders/*-tweet.mp4
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # 3. PC BUILD — free fallback on the user's own machine (home IP).
  #    Runs when the proxy is dead/unset, or if the cloud build failed.
  # ==========================================================================
  pc:
    needs: [probe, cloud]
    # always() is required or this job is skipped whenever `cloud` is skipped.
    # A failed/blank probe also lands here, which is the safe default.
    if: always() && (needs.probe.outputs.cloud != 'true' || needs.cloud.result == 'failure')
    # Self-hosted runner on the user's PC. All three labels must match the
    # runner registered as "marc-pc" (self-hosted, windows, genz-pc).
    runs-on: [self-hosted, windows, genz-pc]
    timeout-minutes: 45

    # Every run step is PowerShell — the runner is Windows, not Linux.
    defaults:
      run:
        shell: pwsh

    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_REELS_NAME: Reels
      YOUTUBE_COOKIES_FILE: youtube_cookies.txt
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # DELIBERATELY NO PROXY_URL HERE. This job exists because the proxy is
      # dead or the cloud attempt failed; passing a dead proxy would make every
      # download 407 instead of going out direct over the trusted home IP.
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_TO: ${{ secrets.NOTIFY_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: we deliberately do NOT use actions/setup-python here. On a
      # self-hosted Windows runner that action hangs trying to provision a
      # tool-cache Python that doesn't exist on a normal PC (it stalled this
      # job for the full 45-min timeout once). The PC already has a working
      # Python (3.13) plus ffmpeg/Deno/node — we just verify and use them.
      - name: Verify build tools + put winget ffmpeg on PATH
        # ffmpeg is installed once via winget (a FULL build that supports -crf).
        # The runner service caches PATH from before that install, so ffmpeg may
        # not be on PATH yet — we FIND the winget binary and add its bin dir to
        # GITHUB_PATH so every later step (and shutil.which in the code) sees the
        # good ffmpeg, NOT the stripped CapCut/bundled builds that reject -crf.
        run: |
          python --version
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            $ff = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'Gyan\.FFmpeg' } | Select-Object -First 1
            if ($ff) {
              $bin = Split-Path $ff.FullName
              Add-Content -Path $env:GITHUB_PATH -Value $bin
              Write-Host "Added winget ffmpeg to PATH: $bin"
            } else {
              Write-Host "::warning::winget ffmpeg not found; the code's resolver will still locate it via its known install path."
            }
          } else {
            Write-Host "ffmpeg already on PATH: $((Get-Command ffmpeg).Source)"
          }
          foreach ($tool in 'deno','node') {
            $c = Get-Command $tool -ErrorAction SilentlyContinue
            if ($c) { Write-Host "OK  $tool -> $($c.Source)" } else { Write-Host "::warning::$tool not on PATH (yt-dlp can still run; JS solver may degrade)" }
          }

      - name: Install Python dependencies (persistent venv)
        # Use a venv that lives OUTSIDE the repo so `actions/checkout` clean
        # never deletes it — installs are slow the first run, then near-instant
        # on every later run (the self-hosted PC reuses it). Keeps the build's
        # deps out of the user's global site-packages too.
        id: venv
        run: |
          $venv = "C:\actions-runner\genz-venv"
          if (-not (Test-Path "$venv\Scripts\python.exe")) {
            Write-Host "Creating venv at $venv ..."
            python -m venv $venv
          }
          $py = "$venv\Scripts\python.exe"
          & $py -m pip install --upgrade pip
          & $py -m pip install -r requirements.txt
          & $py -m pip install yt-dlp
          "python=$py" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using venv python: $py"

      - name: Write .env
        # OVERWRITE (not append): a self-hosted runner reuses the same working
        # directory across runs, and .env is gitignored so checkout won't wipe
        # it. Starting fresh each run avoids stale/duplicate keys piling up —
        # and critically, drops any PROXY_URL a previous cloud-mode run left.
        run: |
          $lines = @(
            "GOOGLE_SHEET_ID=$env:GOOGLE_SHEET_ID"
            "GOOGLE_SHEET_REELS_NAME=$env:GOOGLE_SHEET_REELS_NAME"
            "YOUTUBE_API_KEY=$env:YOUTUBE_API_KEY"
          )
          Set-Content -Path .env -Value $lines -Encoding utf8

      - name: Write Google service account
        # Pass the secret through the ENV (not inline ${{ }}) so PowerShell
        # never reinterprets braces/quotes inside the JSON, and write it as
        # raw UTF-8 with no BOM so Python's json loader is happy.
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          [System.IO.File]::WriteAllText("$PWD/google_service_account.json", $env:GOOGLE_SERVICE_ACCOUNT_JSON)

      - name: Write Drive OAuth token
        # Pre-authorized token JSON (run publish_reel.py locally once to mint it,
        # then copy the contents of google_drive_token.json into this secret).
        env:
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:GOOGLE_DRIVE_TOKEN_JSON)) {
            [System.IO.File]::WriteAllText("$PWD/google_drive_token.json", $env:GOOGLE_DRIVE_TOKEN_JSON)
          }

      - name: Write YouTube cookies (OPTIONAL — cookieless is the default)
        # Downloads use multiple cookieless YouTube player clients
        # (tv/ios/android/web_safari) and try each until one works, so login
        # cookies are NOT required. From this self-hosted PC's home IP the
        # cookieless path works reliably (YouTube trusts residential IPs). If
        # the secret IS present we still write it as a bonus for rare age-gated
        # clips; empty is totally normal — NOT a warning.
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YOUTUBE_COOKIES)) {
            Write-Host "::notice::No YOUTUBE_COOKIES secret — using cookieless clients from the home IP (the normal, reliable path)."
          } else {
            $env:YOUTUBE_COOKIES | Out-File -FilePath youtube_cookies.txt -Encoding ascii
            $lines = (Get-Content youtube_cookies.txt | Measure-Object -Line).Lines
            Write-Host "Wrote youtube_cookies.txt ($lines lines) — used as a bonus backup."
          }

      - name: Resolve target (topic preferred, row_index fallback)
        id: target
        env:
          # Topic is the robust selector: it can't drift if the sheet is
          # re-sorted between n8n firing and this build running. row_index
          # is kept only as a fallback for old callers / manual runs.
          TOPIC: ${{ github.event.client_payload.topic || github.event.inputs.topic }}
          ROW_INDEX: ${{ github.event.client_payload.row_index || github.event.inputs.row_index }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:TOPIC)) {
            "mode=topic"        | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "topic=$env:TOPIC"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Building reel for Topic: $env:TOPIC"
          } elseif (-not [string]::IsNullOrWhiteSpace($env:ROW_INDEX)) {
            "mode=row"          | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "row=$env:ROW_INDEX" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Building reel for Reels row $env:ROW_INDEX (no topic given)"
          } else {
            Write-Host "::error::Neither topic nor row_index provided"
            exit 1
          }

      - name: Build reel
        env:
          TOPIC: ${{ steps.target.outputs.topic }}
          ROW: ${{ steps.target.outputs.row }}
          MODE: ${{ steps.target.outputs.mode }}
          PY: ${{ steps.venv.outputs.python }}
        run: |
          New-Item -ItemType Directory -Force -Path logs, renders | Out-Null
          $ErrorActionPreference = 'Continue'
          if ($env:MODE -eq 'topic') {
            & $env:PY publisher/tweet_card_reel.py --topic "$env:TOPIC" 2>&1 | Tee-Object -FilePath "logs/tweet_card_reel.log"
          } else {
            & $env:PY publisher/tweet_card_reel.py --row "$env:ROW" 2>&1 | Tee-Object -FilePath "logs/tweet_card_reel_row$($env:ROW).log"
          }
          # Propagate the Python exit code so a real build failure fails the step.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::tweet_card_reel.py exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweet-card-reel-logs-pc-${{ github.run_id }}
          path: logs/
          retention-days: 7

      - name: Upload reel mp4 (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tweet-card-reel-mp4-pc-${{ github.run_id }}
          path: renders/*-tweet.mp4
          retention-days: 7
          if-no-files-found: ignore
